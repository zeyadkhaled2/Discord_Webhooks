name: THE FINALS updates

on:
  schedule:
    - cron: "*/15 * * * *"   # checks every 15 minutes (use "0,30 * * * *" for a private repo)
  workflow_dispatch:          # lets you run it manually to test

permissions:
  contents: write             # needed to save finals_state.json back to the repo

concurrency:
  group: finals-updates       # never run two checks at the same time
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python finals_updates.py
        env:
          # left side must stay DISCORD_WEBHOOK_URL; change only the right side
          # if your secret has a different name
          DISCORD_WEBHOOK_URL_4: ${{ secrets.DISCORD_WEBHOOK_URL_4 }}
      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add finals_state.json
          git diff --cached --quiet || (git commit -m "Update state" && git push)
